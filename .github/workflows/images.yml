name: images

# Push registry.gitlab.com/hyperbyte-dev/containers/hyperbyte-site:<sha>-<unix>.
# Flux on n3 takes the newest tag and commits it into hyperbyte-platform.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag
        id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)-$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.gitlab.com/hyperbyte-dev/containers/hyperbyte-site:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
