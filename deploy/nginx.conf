# Static site for hyperbyte.cloud. Listens on 8080 so Traefik talks plain HTTP.
server {
    listen 8080;
    server_name www.hyperbyte.cloud;
    return 301 https://hyperbyte.cloud$request_uri;
}

server {
    listen 8080 default_server;
    server_name hyperbyte.cloud;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The previous host 301'd "/" to "/home/" with a year-long cache. Serving
    # the homepage here keeps those browsers from looping back to "/".
    location = /home/ {
        try_files /index.html =404;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
